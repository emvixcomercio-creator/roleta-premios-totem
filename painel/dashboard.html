<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | Painel Gira e Ganha</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="panel-header">
  <img class="header-logo" src="assets/radio-transcontinental-logo.png" alt="">
  <div class="header-title">
    Painel de Ativações
    <small id="tenantName">Carregando...</small>
  </div>
  <button class="logout-btn" id="logoutBtn">Sair</button>
</div>

<div class="panel-body">
  <h2>Clientes</h2>
  <p class="panel-subtitle">Cada card é um cliente que roda no totem (ex: Assaí, Carrefour). Baixe a configuração e importe no totem no dia da ativação.</p>

  <div class="client-grid" id="clientGrid">
    <div class="new-client-card" id="newClientCard">
      <span class="plus">+</span>
      Novo cliente
    </div>
  </div>

  <div class="empty-state" id="emptyState" style="display:none;">Nenhum cliente cadastrado ainda. Toque em "+ Novo cliente" pra começar.</div>
</div>

<script type="module">
import { supabase } from './shared/supabaseClient.js';
import { requireSession, getMyTenant, logout } from './shared/auth.js';
import { buildTotemExportPayload, triggerJsonDownload, slugify } from './shared/exportFormat.js';

await requireSession();

document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('newClientCard').addEventListener('click', () => {
  window.location.href = 'cliente.html';
});

let tenant;
try{
  tenant = await getMyTenant();
  document.getElementById('tenantName').textContent = tenant.tenantName || '';
} catch(err){
  document.getElementById('tenantName').textContent = err.message;
  throw err;
}

const grid = document.getElementById('clientGrid');
const newCard = document.getElementById('newClientCard');
const emptyState = document.getElementById('emptyState');

const { data: clients, error } = await supabase
  .from('brand_clients')
  .select('*')
  .eq('tenant_id', tenant.tenantId)
  .order('title', { ascending: true });

if(error){
  emptyState.textContent = 'Não foi possível carregar os clientes: ' + error.message;
  emptyState.style.display = 'block';
} else if(!clients || clients.length === 0){
  emptyState.style.display = 'block';
} else {
  clients.forEach(client => {
    const card = document.createElement('div');
    card.className = 'client-card';
    card.innerHTML = `
      <div class="client-logo">${client.logo_url ? `<img src="${client.logo_url}" alt="">` : '🎡'}</div>
      <div class="client-name"></div>
      <div class="client-meta">${(client.prizes || []).length} prêmios na roleta</div>
      <button type="button" class="client-download">⬇ Baixar configuração</button>
    `;
    card.querySelector('.client-name').textContent = client.title || 'Sem nome';

    card.addEventListener('click', () => {
      window.location.href = `cliente.html?id=${client.id}`;
    });

    const downloadBtn = card.querySelector('.client-download');
    downloadBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const original = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Gerando...';
      try{
        const payload = await buildTotemExportPayload(client);
        triggerJsonDownload(payload, slugify(client.title));
        downloadBtn.textContent = '✅ Baixado!';
      } catch(err){
        downloadBtn.textContent = '⚠️ Erro ao gerar';
        console.error(err);
      }
      setTimeout(() => { downloadBtn.textContent = original; downloadBtn.disabled = false; }, 1800);
    });

    grid.appendChild(card);
  });
}
</script>
</body>
</html>
