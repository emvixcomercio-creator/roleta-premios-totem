<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | Painel Gira e Ganha</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="panel-header">
  <a class="header-brand" href="dashboard.html">
    <img class="header-logo" src="assets/radio-transcontinental-logo.png" alt="">
    <div class="header-title">
      Painel de Ativações
      <small id="tenantName">Carregando...</small>
    </div>
  </a>
  <button class="logout-btn" id="logoutBtn">Sair</button>
</div>

<div class="panel-shell">
  <nav class="side-nav">
    <a href="dashboard.html" class="active"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Clientes</a>
    <a href="agenda.html"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> Agenda</a>
    <a href="ajuda.html"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Ajuda</a>
  </nav>

  <div class="panel-main">
    <div class="panel-body">
      <h2>Clientes</h2>
      <p class="panel-subtitle">Cada card é um cliente que roda no totem (ex: Assaí, Carrefour). Baixe a configuração e importe no totem no dia da ativação.</p>

      <div class="client-grid" id="clientGrid">
        <div class="new-client-card" id="newClientCard">
          <span class="plus">+</span>
          Novo cliente
        </div>
      </div>

      <div class="empty-state" id="emptyState" style="display:none;">Nenhum cliente cadastrado ainda. Toque em "+ Novo cliente" pra começar.</div>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from './shared/supabaseClient.js';
import { requireSession, getMyTenant, logout } from './shared/auth.js';
import { buildTotemExportPayload, triggerJsonDownload, slugify } from './shared/exportFormat.js';
import { ICON_DOWNLOAD, ICON_IMAGE_PLACEHOLDER } from './shared/icons.js';

await requireSession();

document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('newClientCard').addEventListener('click', () => {
  window.location.href = 'cliente.html';
});

let tenant;
try{
  tenant = await getMyTenant();
  document.getElementById('tenantName').textContent = tenant.tenantName || '';
} catch(err){
  document.getElementById('tenantName').textContent = err.message;
  throw err;
}

const grid = document.getElementById('clientGrid');
const newCard = document.getElementById('newClientCard');
const emptyState = document.getElementById('emptyState');

const { data: clients, error } = await supabase
  .from('brand_clients')
  .select('*')
  .eq('tenant_id', tenant.tenantId)
  .order('title', { ascending: true });

const STATUS_LABEL = {
  primeiro_contato:   'Primeiro contato',
  proposta_enviada:   'Proposta enviada',
  contrato_fechado:   'Contrato fechado',
  ativacao_agendada:  'Ativação agendada',
  ativacao_realizada: 'Ativação realizada'
};

if(error){
  emptyState.textContent = 'Não foi possível carregar os clientes: ' + error.message;
  emptyState.style.display = 'block';
} else if(!clients || clients.length === 0){
  emptyState.style.display = 'block';
} else {
  clients.forEach(client => {
    const card = document.createElement('div');
    card.className = 'client-card';
    const contactLine = client.contact_name || client.contact_phone
      ? [client.contact_name, client.contact_phone].filter(Boolean).join(' · ')
      : '';
    const relStatus = client.relationship_status || 'primeiro_contato';
    const logoInner = client.logo_url ? `<img src="${client.logo_url}" alt="">` : ICON_IMAGE_PLACEHOLDER;
    card.innerHTML = `
      <span class="status-badge ${relStatus}"><span class="status-dot"></span>${STATUS_LABEL[relStatus] || relStatus}</span>
      <div class="client-logo">${logoInner}</div>
      <div class="client-name"></div>
      <div class="client-meta">${(client.prizes || []).length} prêmios na roleta</div>
      ${contactLine ? `<div class="client-meta"></div>` : ''}
      <button type="button" class="client-download">${ICON_DOWNLOAD} Baixar configuração</button>
    `;
    card.querySelector('.client-name').textContent = client.title || 'Sem nome';
    if(contactLine){
      card.querySelectorAll('.client-meta')[1].textContent = contactLine;
    }

    card.addEventListener('click', () => {
      window.location.href = `cliente.html?id=${client.id}`;
    });

    const downloadBtn = card.querySelector('.client-download');
    downloadBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const original = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Gerando...';
      try{
        const payload = await buildTotemExportPayload(client);
        triggerJsonDownload(payload, slugify(client.title));
        downloadBtn.textContent = 'Salvo na pasta Downloads!';
        downloadBtn.classList.add('success');
      } catch(err){
        downloadBtn.textContent = 'Erro ao gerar arquivo';
        downloadBtn.classList.add('error');
        console.error(err);
      }
      setTimeout(() => {
        downloadBtn.textContent = original;
        downloadBtn.classList.remove('success', 'error');
        downloadBtn.disabled = false;
      }, 2600);
    });

    grid.appendChild(card);
  });
}
</script>
</body>
</html>
