<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda | Painel Gira e Ganha</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="panel-header">
  <a class="header-brand" href="dashboard.html">
    <img class="header-logo" src="assets/radio-transcontinental-logo.png" alt="">
    <div class="header-title">
      Painel de Ativações
      <small id="tenantName">Carregando...</small>
    </div>
  </a>
  <button class="logout-btn" id="logoutBtn">Sair</button>
</div>

<div class="panel-shell">
  <nav class="side-nav">
    <a href="dashboard.html"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Clientes</a>
    <a href="agenda.html" class="active"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> Agenda</a>
    <a href="usuarios.html"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></span> Usuários</a>
    <a href="ajuda.html"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Ajuda</a>
    <a href="treinamento.html"><span class="icon" style="width:18px;height:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span> Treinamento</a>
  </nav>

  <div class="panel-main">
    <div class="panel-body">
      <h2>Agenda de ativações</h2>
      <p class="panel-subtitle">Datas e locais combinados com cada cliente. Isso é só organização interna — não afeta o totem.</p>

      <div class="activation-list" id="activationList">
        <div class="new-activation-card" id="newActivationCard">+ Nova ativação</div>
      </div>

      <div class="empty-state" id="emptyState" style="display:none;">Nenhuma ativação agendada ainda.</div>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from './shared/supabaseClient.js';
import { requireSession, getMyTenant, logout } from './shared/auth.js';

await requireSession();
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('newActivationCard').addEventListener('click', () => {
  window.location.href = 'ativacao.html';
});

const tenant = await getMyTenant();
document.getElementById('tenantName').textContent = tenant.tenantName || '';

const list = document.getElementById('activationList');
const emptyState = document.getElementById('emptyState');

const { data: activations, error } = await supabase
  .from('activations')
  .select('*')
  .eq('tenant_id', tenant.tenantId)
  .order('scheduled_date', { ascending: true });

const STATUS_LABEL = { agendada: 'Agendada', concluida: 'Concluída', cancelada: 'Cancelada' };

function formatDateBadge(isoDate){
  const [year, month, day] = isoDate.split('-');
  return `${day}/${month}`;
}

if(error){
  emptyState.textContent = 'Não foi possível carregar a agenda: ' + error.message;
  emptyState.style.display = 'block';
} else if(!activations || activations.length === 0){
  emptyState.style.display = 'block';
} else {
  activations.forEach(item => {
    const row = document.createElement('div');
    row.className = 'activation-row';
    row.innerHTML = `
      <div class="activation-date">${formatDateBadge(item.scheduled_date)}</div>
      <div class="activation-info">
        <div class="activation-client"></div>
        <div class="activation-meta"></div>
      </div>
      <span class="status-badge ${item.status}"><span class="status-dot"></span>${STATUS_LABEL[item.status] || item.status}</span>
    `;
    row.querySelector('.activation-client').textContent = item.client_title || 'Sem cliente';
    row.querySelector('.activation-meta').textContent = item.location || 'Local não definido';
    row.addEventListener('click', () => {
      window.location.href = `ativacao.html?id=${item.id}`;
    });
    list.appendChild(row);
  });
}
</script>
</body>
</html>
